<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chess Board</title>

  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: vh;
      margin: 0;
      background: #f3ebeb;
    }

    .chessboard {
      width: 640px;
      height: 640px;
      display: grid; 
      grid-template-columns: repeat(8, 1fr);
      border: 8px solid #111;
    }

    .square {
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 55px;
      cursor: pointer;
      user-select: none;
    }

    .light {
      background: #fcfbf9;
    }

    .dark {
      background: #3d3936;
    }

    .square:hover {
      background: #f7ec74;
    }
  </style>
</head>

<body>

  <div class="chessboard">

    <!-- Row 1 -->
    <div class="square light">♜</div>
    <div class="square dark">♞</div>
    <div class="square light">♝</div>
    <div class="square dark">♛</div>
    <div class="square light">♚</div>
    <div class="square dark">♝</div>
    <div class="square light">♞</div>
    <div class="square dark">♜</div>

    <!-- Row 2 -->
    <div class="square dark">♟</div>
    <div class="square light">♟</div>
    <div class="square dark">♟</div>
    <div class="square light">♟</div>
    <div class="square dark">♟</div>
    <div class="square light">♟</div>
    <div class="square dark">♟</div>
    <div class="square light">♟</div>

    <!-- Row 3 -->
    <div class="square light"></div>
    <div class="square dark"></div>
    <div class="square light"></div>
    <div class="square dark"></div>
    <div class="square light"></div>
    <div class="square dark"></div>
    <div class="square light"></div>
    <div class="square dark"></div>

    <!-- Row 4 -->
    <div class="square dark"></div>
    <div class="square light"></div>
    <div class="square dark"></div>
    <div class="square light"></div>
    <div class="square dark"></div>
    <div class="square light"></div>
    <div class="square dark"></div>
    <div class="square light"></div>

    <!-- Row 5 -->
    <div class="square light"></div>
    <div class="square dark"></div>
    <div class="square light"></div>
    <div class="square dark"></div>
    <div class="square light"></div>
    <div class="square dark"></div>
    <div class="square light"></div>
    <div class="square dark"></div>

    <!-- Row 6 -->
    <div class="square dark"></div>
    <div class="square light"></div>
    <div class="square dark"></div>
    <div class="square light"></div>
    <div class="square dark"></div>
    <div class="square light"></div>
    <div class="square dark"></div>
    <div class="square light"></div>

    <!-- Row 7 -->
    <div class="square light">♙</div>
    <div class="square dark">♙</div>
    <div class="square light">♙</div>
    <div class="square dark">♙</div>
    <div class="square light">♙</div>
    <div class="square dark">♙</div>
    <div class="square light">♙</div>
    <div class="square dark">♙</div>

    <!-- Row 8 -->
    <div class="square dark">♖</div>
    <div class="square light">♘</div>
    <div class="square dark">♗</div>
    <div class="square light">♕</div>
    <div class="square dark">♔</div>
    <div class="square light">♗</div>
    <div class="square dark">♘</div>
    <div class="square light">♖</div>

  </div>

</body>
</html>
